org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Pin the JDK Gradle itself runs on. Without this, Android Studio launches
# Gradle with its own bundled JBR (Java 25 in Android Studio 2026.1), which
# Gradle 8.12/AGP can't parse ("What went wrong: 25.0.3" with no further
# detail) — even though the Flutter CLI works fine because `flutter config
# --jdk-dir` separately points *it* at JDK 17. This makes both paths use the
# same JDK. If this path doesn't exist on your machine, install Temurin/
# Homebrew JDK 17 and update it (or delete this line and set the Gradle JDK
# to 17 in Android Studio's Settings > Build Tools > Gradle instead).
org.gradle.java.home=/opt/homebrew/Cellar/openjdk@17/17.0.17/libexec/openjdk.jdk/Contents/Home
